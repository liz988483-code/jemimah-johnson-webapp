server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS terminates at the shared Caddy reverse proxy in front of this container (see
    # embrace-proxy's Caddyfile, which reverse_proxys jemimahandassociates.com to
    # jemimah-app:80) -- this container is only ever reached over plain HTTP on the
    # private embrace-network, so $scheme here is always "http". Pass through the
    # scheme Caddy already recorded instead, so the backend sees the real visitor scheme.
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
