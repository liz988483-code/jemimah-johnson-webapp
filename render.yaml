services:
  - type: web
    name: jemimah-johnson-api
    env: node
    buildCommand: npm install --include=dev && npm run build:backend
    startCommand: node backend/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_HOST
        fromDatabase:
          name: jemimah-johnson-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: jemimah-johnson-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: jemimah-johnson-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: jemimah-johnson-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: jemimah-johnson-db
          property: database
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d
      - key: ADMIN_EMAIL
        value: admin@jemimahjohnston.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: FRONTEND_URL
        value: https://jemimah-johnson-webapp.vercel.app
      - key: CORS_ORIGINS
        value: https://jemimah-johnson-webapp.vercel.app
      - key: DB_DIALECT
        value: postgres
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_TRANSACTION_TYPE
        value: CustomerPayBillOnline
      - key: MPESA_ENVIRONMENT
        value: sandbox
      - key: MPESA_CALLBACK_URL
        value: https://jemimah-johnson-api.onrender.com/api/mpesa
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

databases:
  - name: jemimah-johnson-db
    databaseName: jemimah_johnson
    user: jemimah_johnson_user
